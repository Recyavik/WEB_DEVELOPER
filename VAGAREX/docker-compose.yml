services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       vegarex
      POSTGRES_USER:     vegarex
      POSTGRES_PASSWORD: vegarex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegarex"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:    postgresql+psycopg2://vegarex:vegarex@db/vegarex
      SIMULATION_MODE: "1"
      WHISPER_MODEL:   base
      TRY_CUDA:        "0"
      WORLD_WIDTH_CM:  "500"
      WORLD_HEIGHT_CM: "500"
      MOVE_SPEED:      "40"
      TURN_ANGLE:      "36"
      # Реальный робот: для боевого режима через bridge-сервис (ниже)
      # ставим адрес ws://bridge:41235 в Настройках. Эти ENV — дефолты
      # для прямого TCP-режима к старой плате REX Board.
      REX_SERVER_HOST: "192.168.1.100"
      REX_SERVER_PORT: "8765"
    volumes:
      - .:/app                  # hot-reload в разработке
      - app_data:/app/instance  # persistent для SQLite/файлов (если без db)

  # ── bridge: WebSocket-релей VEGAREX ↔ ESP32 ─────────────────────────
  # Автозапуск вместе с приложением. В Настройках адрес —
  # ws://bridge:41235 (Docker DNS). ESP32 по WiFi подключается на
  # порт хоста 8080 (проброшен ниже).
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    ports:
      - "8080:8080"   # ESP32 -> хост (WiFi)
      # 41235 наружу не пробрасываем — внутри Docker network достаточно

volumes:
  pgdata:
  app_data:
