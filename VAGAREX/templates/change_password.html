{% extends "base.html" %}

{% block title %}VEGAREX — Сменить пароль{% endblock %}

{% block content %}
<div class="auth-layout">
  <form method="POST" action="/account/password" class="auth-form">
    <h2 class="auth-title">Сменить пароль</h2>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="auth-success">{{ success }}</div>
    {% endif %}

    <label class="settings-label">Текущий пароль</label>
    <input class="settings-input" type="password" name="current_password" required autofocus>

    <label class="settings-label">Новый пароль</label>
    <input class="settings-input" type="password" name="new_password" required minlength="4">

    <label class="settings-label">Повторите новый пароль</label>
    <input class="settings-input" type="password" name="new_password2" required minlength="4">

    <button type="submit" class="btn btn--primary" style="margin-top:1rem">Сменить</button>

    <div class="auth-alt">
      <a href="/">← Назад на главную</a>
    </div>
  </form>
</div>
{% endblock %}
